<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الاشتراكات — أرابيكا (Testnet)</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
  * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
  body { margin: 0; padding: 14px; background: #12141c; color: #e8e8e8; }
  h2 { color: #D4AF37; font-size: 19px; margin: 6px 0 2px; }
  .note { background: #1e2530; border: 1px solid #D4AF37; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.7; margin: 10px 0; }
  .card { background: #1a1d29; border-radius: 12px; padding: 12px; margin: 10px 0; }
  .card h3 { margin: 0 0 8px; font-size: 15px; color: #9db4ff; }
  button { display: block; width: 100%; margin: 7px 0; padding: 13px; font-size: 15px; font-weight: bold; border: none; border-radius: 10px; background: #D4AF37; color: #1a1a1a; cursor: pointer; }
  button.sec { background: #2b3350; color: #cdd7ff; }
  button.danger { background: #4b2230; color: #ffb3c0; }
  button:disabled { opacity: .45; }
  input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #333a55; background: #0e1119; color: #fff; font-size: 15px; }
  label { font-size: 13px; color: #9aa3bb; }
  #log { background: #05070c; border-radius: 10px; padding: 10px; font-size: 11.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; max-height: 45vh; overflow-y: auto; direction: ltr; text-align: left; color: #8fe3a8; }
  .me { font-size: 13px; color: #8fe3a8; word-break: break-all; white-space: pre-line; }
</style>
</head>
<body>

<h2>🧪 مختبر الاشتراكات — Pi Testnet <small style="font-size:11px;color:#8fe3a8">v4</small></h2>
<div class="note">⚠️ داخل <b>Pi Browser</b> فقط. اضغط «⚡ تجهيز» بعد الدخول — سيملأ القوائم تلقائياً (مع إعادة محاولة عند فشل الشبكة).</div>

<div class="card">
  <h3>1) الدخول</h3>
  <button id="b-login" onclick="piLogin()">🔐 تسجيل الدخول عبر Pi</button>
  <div class="me" id="me"></div>
  <label>احتياطي: عنوان المحفظة يدوياً (G...)</label>
  <input id="in-addr" placeholder="G..." style="direction:ltr">
  <button class="sec" onclick="manualAddr()">✔️ استخدام هذا العنوان</button>
  <button id="b-boot" onclick="bootstrap()" disabled>⚡ تجهيز (جلب الخدمات + الاشتراكات + الحالة)</button>
</div>

<div class="card">
  <h3>2) الخدمات</h3>
  <select id="sel-service" onchange="onServiceChange()"></select>
  <button class="sec" onclick="myServices()">🔄 تحديث قائمة الخدمات</button>
  <button id="b-reg2" onclick="registerQuick()" disabled>⚗️ تسجيل خدمة تجربة (دورة دقيقتان)</button>
  <button class="sec" id="b-reg" onclick="registerService()" disabled>📝 إعادة تسجيل الخدمة الرسمية (غير مطلوب — 473 قائمة)</button>
</div>

<div class="card">
  <h3>3) الاشتراك</h3>
  <button id="b-sub" onclick="doSubscribe()" disabled>⭐ اشتراك في الخدمة المختارة</button>
  <button class="sec" onclick="checkActive()">✅ هل اشتراكي فعّال؟</button>
  <select id="sel-sub"></select>
  <button class="sec" onclick="mySubs()">🔄 تحديث قائمة الاشتراكات</button>
</div>

<div class="card">
  <h3>4) الإدارة</h3>
  <button class="danger" id="b-cancel" onclick="doCancel()" disabled>✖️ إلغاء التجديد للاشتراك المختار</button>
  <button class="sec" id="b-process" onclick="doProcess()" disabled>💰 تحصيل مستحقات الخدمة المختارة</button>
</div>

<div class="card">
  <h3>السجل</h3>
  <div id="log"></div>
  <button class="sec" onclick="document.getElementById('log').innerHTML=''">🧹 مسح السجل</button>
</div>

<script>
// قسم: الثوابت والحالة
var SERVICE_NAME = "Arabeka Premium Badge";
var QUICK_NAME = "Arabeka Cycle Test";

// قسم: أدوات مساعدة
function log(tag, data, top) {
  var el = document.getElementById('log');
  var time = new Date().toLocaleTimeString('en-GB');
  var body;
  try { body = typeof data === 'string' ? data : JSON.stringify(data, function (k, v) { return typeof v === 'bigint' ? v.toString() : v; }, 2); }
  catch (e) { body = String(data); }
  var line = '[' + time + '] ' + tag + '\n' + body + '\n\n';
  if (top) { el.innerHTML = line + el.innerHTML; } else { el.innerHTML = el.innerHTML + line; }
  el.scrollTop = 0;
}
function fail(tag, e) {
  var msg = (e && (e.message || e.code)) ? (e.message || e.code) : String(e);
  log('❌ ' + tag, msg, true);
  console.error(e);
}
function myAddress() { return window._piAddr; }
function sub2() { return Pi.SmartContract.Subscription; }
function asList(r) {
  if (!r) return [];
  if (Array.isArray(r)) return r;
  if (Array.isArray(r.services)) return r.services;
  if (Array.isArray(r.subscriptions)) return r.subscriptions;
  if (Array.isArray(r.subs)) return r.subs;
  return [r];
}
function fillSelect(id, arr, fmt) {
  var sel = document.getElementById(id);
  sel.innerHTML = '';
  arr.forEach(function (x) {
    var o = document.createElement('option');
    o.value = String(x._val); o.textContent = fmt(x);
    sel.appendChild(o);
  });
}
function selectedService() { var s = document.getElementById('sel-service'); return s.value ? parseInt(s.value, 10) : null; }
function selectedSub() { var s = document.getElementById('sel-sub'); return s.value ? parseInt(s.value, 10) : null; }
function withRetry(fn, tries) {
  tries = tries || 3;
  return fn().catch(function (e) {
    if (tries <= 1) throw e;
    return new Promise(function (res) { setTimeout(res, 1500); }).then(function () { return withRetry(fn, tries - 1); });
  });
}
function sleep(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
function afterSubmit(label) {
  log('⏳ انتظار تأكيد السلسلة (~10 ثوانٍ)…', label);
  return sleep(10000).then(bootstrap);
}

// قسم: الدخول
function setAddress(a) {
  window._piAddr = a;
  document.getElementById('me').textContent = '👤 ' + (window._piName || '') + '\n' + a;
  ['b-boot', 'b-reg', 'b-reg2', 'b-sub', 'b-cancel', 'b-process'].forEach(function (id) { document.getElementById(id).disabled = !a; });
}
function piLogin() {
  Pi.init({ version: "2.0", sandbox: false });
  Pi.authenticate(['username', 'payments', 'wallet_address'], function () {}).then(function (auth) {
    var u = auth && auth.user ? auth.user : {};
    window._piName = u.username || null;
    log('تم الدخول', { username: window._piName, scopes: u.credentials && u.credentials.scopes });
    if (typeof Pi.getUserWalletAddresses !== 'function') { log('⚠️', 'getUserWalletAddresses غير موجودة — استخدم الإدخال اليدوي'); return null; }
    return Pi.getUserWalletAddresses();
  }).then(function (w) {
    if (!w) return;
    log('المحافظ المرجعة', w);
    var arr = (w && w.wallets) || [];
    if (arr.length && arr[0].publicKey) setAddress(arr[0].publicKey);
    else log('⚠️', 'لا محافظ مرجعة — استخدم الإدخال اليدوي');
  }).catch(function (e) { fail('الدخول/جلب المحافظ', e); });
}
function manualAddr() {
  var a = (document.getElementById('in-addr').value || '').trim();
  if (!/^G[A-Z2-7]{55}$/.test(a)) { log('❌ عنوان غير صالح', a, true); return; }
  setAddress(a); log('✅ عنوان يدوي معتمد', a);
}
function bootstrap() {
  if (!myAddress()) { log('⚠️', 'سجّل الدخول أولاً', true); return; }
  log('⚡ جارٍ التجهيز…', '3 قراءات من البلوكشين');
  return myServices().then(mySubs).then(function () { return checkActive(true); });
}

// قسم: الخدمات
function registerService() {
  log('⏳ تسجيل الخدمة الرسمية…', SERVICE_NAME + ' — 1 Pi / 30 يوم');
  sub2().registerService(myAddress(), SERVICE_NAME, 10000000, 2592000, 0, 3, { mode: 'submit' })
    .then(function (r) { log('✅ سُجلت الخدمة', r); return afterSubmit('registerService'); })
    .catch(function (e) { fail('registerService', e); });
}
function registerQuick() {
  log('⏳ تسجيل خدمة التجربة…', QUICK_NAME + ' — 0.1 Pi / دقيقتان');
  sub2().registerService(myAddress(), QUICK_NAME, 1000000, 120, 0, 3, { mode: 'submit' })
    .then(function (r) { log('✅ سُجلت خدمة التجربة', r); return afterSubmit('registerQuick'); })
    .catch(function (e) { fail('registerQuick', e); });
}
function myServices() {
  return withRetry(function () {
    return sub2().getMerchantServices(myAddress(), { mode: 'simulate' });
  }).then(function (r) {
    log('خدماتي', r);
    var arr = asList(r).map(function (s) { s._val = parseInt(s.service_id, 10); return s; });
    fillSelect('sel-service', arr, function (s) { return s.name + ' — #' + s._val; });
    if (!arr.length) log('⚠️', 'لا خدمات ظاهرة بعد');
  }).catch(function (e) { fail('getMerchantServices (بعد 3 محاولات)', e); });
}
function onServiceChange() { checkActive(true); }

// قسم: الاشتراك
function doSubscribe() {
  var sid = selectedService();
  if (sid === null) { log('⚠️', 'اضغط «⚡ تجهيز» أو «تحديث الخدمات» أولاً', true); return; }
  log('⏳ اشتراك في الخدمة #' + sid + '…', 'ستظهر شاشة محفظتك للتوقيع');
  sub2().subscribe(myAddress(), sid, true, 3, { mode: 'submit' })
    .then(function (r) { log('✅ أُرسل الاشتراك', r); return afterSubmit('subscribe'); })
    .catch(function (e) { fail('subscribe', e); });
}
function checkActive(quiet) {
  var sid = selectedService();
  if (sid === null) { if (!quiet) log('⚠️', 'لا خدمة مختارة', true); return; }
  return withRetry(function () {
    return sub2().isSubscriptionActive(myAddress(), sid, { mode: 'simulate' });
  }).then(function (r) { log('الحالة للخدمة #' + sid, { active: r }); })
    .catch(function (e) { fail('isSubscriptionActive', e); });
}
function mySubs() {
  return withRetry(function () {
    return sub2().getSubscriberSubscriptions(myAddress(), { mode: 'simulate' });
  }).then(function (r) {
    log('اشتراكاتي', r);
    var arr = asList(r).map(function (s) { s._val = parseInt(s.sub_id, 10); return s; });
    fillSelect('sel-sub', arr, function (s) { return 'اشتراك #' + s._val + ' → خدمة #' + s.service_id; });
    if (!arr.length) log('⚠️', 'لا اشتراكات ظاهرة بعد');
  }).catch(function (e) { fail('getSubscriberSubscriptions (بعد 3 محاولات)', e); });
}

// قسم: الإدارة
function doCancel() {
  var sub = selectedSub();
  if (sub === null) { log('⚠️', 'حدّث قائمة الاشتراكات أولاً', true); return; }
  sub2().cancel(myAddress(), sub, { mode: 'submit' })
    .then(function (r) { log('✅ أُلغي التجديد', r); return afterSubmit('cancel'); })
    .catch(function (e) { fail('cancel', e); });
}
function doProcess() {
  var sid = selectedService();
  if (sid === null) { log('⚠️', 'حدّث قائمة الخدمات أولاً', true); return; }
  sub2().process(myAddress(), sid, 0, 50, { mode: 'submit' })
    .then(function (r) { log('✅ نتيجة التحصيل', r); return afterSubmit('process'); })
    .catch(function (e) { fail('process', e); });
}
</script>

</html>
